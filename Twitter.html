<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RucitterShop</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/LemRamLove/gemjanpw8aexzx8ybhwf/refs/heads/main/avi.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- Background & Animations --- */
        #dust-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Twitter-style Gradients & Colors --- */
        .tw-gradient {
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
        }

        .tw-text-gradient {
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- Container --- */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* --- Header --- */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 0 10px 0;
            transition: top 0.3s ease;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .large-title {
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto 15px auto;
            letter-spacing: -1px;
            /* Using Twitter blue gradient text */
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(29, 161, 242, 0.5));
        }

        /* --- Search & Sort --- */
        .search-sort {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            flex: 1;
        }

        .search-icon, .sort-icon {
            background: #262626;
            color: #ffffff;
            border: 1px solid #363636;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .search-icon:focus, .sort-icon:focus {
            outline: none;
            border-color: #1DA1F2;
            box-shadow: 0 0 0 2px rgba(29, 161, 242, 0.2);
        }

        /* --- List Layout --- */
        .store-section {
            margin-top: 180px;
        }

        .horizontal-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 0;
            padding-bottom: 40px;
            width: 100%;
        }

        /* --- Card Design (Twitter Style) --- */
        .list-group-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            border-radius: 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            width: calc(25% - 20px);
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 320px; /* Increased slightly for details */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            list-style: none;
        }

        .list-group-item:hover {
            transform: translateY(-5px);
            background: #222;
            border-color: #444;
            box-shadow: 0 8px 25px rgba(29, 161, 242, 0.15);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            flex-grow: 1;
            justify-content: space-between;
        }

        /* --- Avatar (Twitter Style) --- */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 15px;
            padding: 4px;
            border-radius: 50%;
            background: #1DA1F2; /* Solid Twitter Blue ring */
        }

        .avatar-wrapper img {
            display: block;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #1a1a1a;
            box-sizing: border-box;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .list-group-item:hover .avatar-wrapper img {
            transform: scale(1.05);
        }

        .user-info {
            display: flex;
            align-items: baseline;
            margin-bottom: 15px;
            justify-content: center;
        }

        .at-symbol {
            color: #a0a0a0;
            font-size: 1.2rem;
            margin-right: 4px;
        }

        .text-part {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            word-break: break-all;
        }

        /* --- Details (Restored) --- */
        .account-details {
            margin: 10px 0;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.9;
            line-height: 1.5;
            width: 100%;
        }

        .account-details .detail-item {
            margin: 3px 0;
            color: #ccc;
        }

        .price-tag {
            background: transparent;
            border: 1px solid #333;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 15px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .item-button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            color: #ffffff;
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: opacity 0.3s ease, transform 0.2s;
        }

        .item-button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* --- Scroll To Top Button --- */
        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #scrollTopBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(29, 161, 242, 0.4);
        }

        /* --- Notice Accordion --- */
        .notice-container {
            background: #1a1a1a;
            padding: 20px;
            margin: 20px auto;
            border: 1px solid #333;
            border-radius: 12px;
            max-width: 800px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .notice-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #1DA1F2, #0c85d0);
        }

        .notice-toggle {
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding: 10px 10px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            width: 100%;
            border: none;
            outline: none;
        }

        .notice-toggle:hover {
            color: #0c85d0;
        }

        .toggle-icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
            color: #1DA1F2;
        }

        .toggle-icon.active {
            transform: rotate(180deg);
        }

        .notice-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding: 0 20px;
        }

        .notice-content.active {
            max-height: 800px;
            padding-bottom: 20px;
        }

        .notice-text {
            font-size: 0.9rem;
            color: #d0d0d0;
            line-height: 1.8;
        }

        .notice-text p {
            margin-bottom: 12px;
            padding-left: 15px;
            border-left: 2px solid #333;
        }

        /* --- Footer & Profile --- */
        .purchase-links-section {
            margin-top: 50px;
            padding: 40px 20px;
            background: #121212;
            border-top: 1px solid #333;
        }

        .profile-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            border: 3px solid #333;
            border-radius: 50%;
            margin-bottom: 20px;
            padding: 3px;
            background: linear-gradient(45deg, #1DA1F2, #0c85d0);
        }
        
        .profile-icon img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #1a1a1a;
            box-sizing: border-box;
            background: #333;
        }

        .link-item {
            margin: 15px 0;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .link-item a {
            color: #1DA1F2;
            text-decoration: none;
            font-weight: 600;
            margin-left: 8px;
            transition: color 0.2s;
        }

        .link-item a:hover {
            color: #0c85d0;
            text-decoration: underline;
        }

        /* --- Tokushou (Commercial Law) --- */
        .tokushou-container {
            background: #1a1a1a;
            padding: 20px;
            margin: 30px auto;
            border: 1px solid #333;
            border-radius: 10px;
            max-width: 600px;
            text-align: left;
        }

        .tokushou-toggle {
            cursor: pointer;
            font-size: 1rem;
            color: #888;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        .tokushou-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .tokushou-content.active {
            padding: 15px;
            border-top: 1px solid #333;
        }

        .tokushou-item {
            font-size: 0.85rem;
            color: #aaa;
            margin: 5px 0;
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #444;
            width: 90%;
            max-width: 500px;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #888;
            transition: color 0.2s;
        }

        .close:hover {
            color: #fff;
        }

        .modal-link {
            color: #1DA1F2;
            font-weight: 600;
        }

        /* --- Responsive Design --- */
        @media (max-width: 1200px) {
            .list-group-item { width: calc(33.33% - 20px); }
        }
        @media (max-width: 992px) {
            .list-group-item { width: calc(50% - 20px); }
        }
        @media (max-width: 768px) {
            .large-title { font-size: 2.2rem; margin-bottom: 10px; }
            .fixed-header { padding: 10px 0; }
            .store-section { margin-top: 160px; }
            
            .search-sort {
                width: 100%;
                padding: 0 10px;
                gap: 10px;
            }
            
            .search-icon, .sort-icon {
                font-size: 0.9rem;
                padding: 10px;
            }

            .notice-container { margin: 10px; }

            /* Vertical Stack Layout for Mobile */
            .list-group-item {
                width: 100%;
                max-width: 350px;
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
                margin: 0 auto;
                min-height: auto;
            }

            .avatar-wrapper {
                margin-bottom: 20px;
                margin-right: 0;
            }

            .avatar-wrapper img {
                width: 80px;
                height: 80px;
            }

            .item-info {
                width: 100%;
                flex-direction: column;
                align-items: center;
            }

            .user-info {
                margin-bottom: 15px;
                margin-right: 0;
                flex-direction: row;
                justify-content: center;
            }

            .text-part {
                font-size: 1.2rem;
                word-break: break-word;
            }

            .price-tag {
                margin: 10px 0;
                width: 100%;
                font-size: 1rem;
                text-align: center;
            }

            .item-button {
                width: 100%;
                margin-top: 5px;
                font-size: 1rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="dust-canvas"></canvas>
    
    <div class="store-section">
        <header class="fixed-header">
            <div class="container">
                <div class="large-title">
                    <span style="color:#ffffff;">Ruc</span><span class="tw-text-gradient">itter</span><span style="color:#ffffff;">Shop</span>
                </div>
                <div class="search-sort">
                    <div class="form-group">
                        <input type="text" id="searchInput" class="search-icon" placeholder="ユーザー名を検索..." />
                    </div>
                    <div class="form-group">
                        <select id="sortSelect" class="sort-icon">
                            <option value="default">おすすめ</option>
                            <option value="az">A-Z</option>
                            <option value="price-asc">価格:(安い順)</option>
                            <option value="price-desc">価格:(高い順)</option>
                            <option value="date-desc">新作順</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>
            <ul id="fileContent" class="horizontal-list"></ul>
        </div>
    </div>

    <button id="scrollTopBtn" title="トップへ戻る">↑</button>


    <div id="purchaseModal" class="modal" onclick="closeModalOnOutsideClick(event, 'purchaseModal')">
        <div class="modal-content">
            <span class="close" onclick="closeModal('purchaseModal')">&times;</span>
            <h2 style="margin-top:0;">購入手続き</h2>
            <p>ご購入をご希望の方は、以下の連絡先からお問い合わせください。</p>
            <p>Twitter: <a href="https://tinyurl.com/4rjeuczd" class="modal-link" target="_blank">アカウント</a></p>
            <p>Discord: <a href="https://tinyurl.com/974nkkea" class="modal-link" target="_blank">公式サーバー</a></p>
            <p>LINE: <a href="https://tinyurl.com/2bj8997f" class="modal-link" target="_blank">公式アカウント</a></p>
            <hr style="border-color:#333; opacity:0.3;">
            <p style="font-size:0.85rem; color:#888;">購入前に必ず<a href="https://tinyurl.com/ymktrc8w" class="modal-link" target="_blank">利用規約</a>をご確認ください。</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const numParticles = 70; 

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.4 + 0.05;
                // Twitter Blue Colors
                const colors = ['#1DA1F2', '#0c85d0', '#71c9f8', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.x = Math.random() * canvas.width;
                if (this.y > canvas.height || this.y < 0) this.y = Math.random() * canvas.height;
                this.opacity = Math.random() * 0.4 + 0.05;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        /* --- Modal Logic --- */
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function closeModalOnOutsideClick(event, modalId) {
            if (event.target.classList.contains('modal')) {
                closeModal(modalId);
            }
        }

        /* --- Accordion Logic --- */
        function toggleIgNotice() {
            const content = document.getElementById('noticeContent');
            const toggleIcon = document.querySelector('#notice-container .toggle-icon');
            
            content.classList.toggle('active');
            toggleIcon.classList.toggle('active');
            toggleIcon.textContent = content.classList.contains('active') ? '−' : '+';
        }

        function toggleTokushou() {
            const content = document.getElementById('tokushouContent');
            const toggleIcon = document.querySelector('#tokushou-container .toggle-icon');
            
            content.classList.toggle('active');
            toggleIcon.classList.toggle('active');
            toggleIcon.textContent = content.classList.contains('active') ? '−' : '+';
        }

        /* --- Scroll to Top Logic --- */
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        /* --- Data Handling --- */
        let originalData = [];

        function getNumericPrice(priceStr) {
            if (!priceStr) return 0;
            if (priceStr.includes('～') || priceStr.includes('~')) {
                const parts = priceStr.split(/[～~]/);
                return parseFloat(parts[0]) || 0;
            }
            return parseFloat(priceStr) || 0;
        }

        function loadAndDisplayFile() {
            fetch('https://raw.githubusercontent.com/LrisxL/pxmxmintesuhhm/refs/heads/main/vcsafae.txt')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(data => {
                originalData = parseAccountData(data);
                updateList();
            })
            .catch(error => {
                console.error('ファイル読み込みエラー:', error);
            });
        }

        function parseAccountData(textData) {
            const accounts = [];
            const lines = textData.split('\n').filter(line => line.trim() !== '');
            let currentAccount = {};

            lines.forEach(line => {
                if (line.trim().startsWith('USERNAME=')) {
                    if (currentAccount.USERNAME) {
                        accounts.push({
                            username: currentAccount.USERNAME.replace('@', ''),
                            created: currentAccount.CREATED || '',
                            follow: currentAccount.FOLLOW || '0',
                            followers: currentAccount.FOLLOWERS || '0',
                            posts: currentAccount.POSTS || '0',
                            url: currentAccount.URL || '',
                            price: currentAccount.PRICE || '0'
                        });
                    }
                    currentAccount = {};
                }
                
                const [key, value] = line.split('=');
                if (key && value !== undefined) {
                    currentAccount[key.trim()] = value.trim();
                }
            });

            if (currentAccount.USERNAME) {
                accounts.push({
                    username: currentAccount.USERNAME.replace('@', ''),
                    created: currentAccount.CREATED || '',
                    follow: currentAccount.FOLLOW || '0',
                    followers: currentAccount.FOLLOWERS || '0',
                    posts: currentAccount.POSTS || '0',
                    url: currentAccount.URL || '',
                    price: currentAccount.PRICE || '0'
                });
            }

            return accounts;
        }

        function updateList() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const sortSelect = document.getElementById('sortSelect').value;

            let filteredData = originalData.filter(item => 
                item.username.toLowerCase().includes(searchInput)
            );

            switch (sortSelect) {
                case 'price-desc':
                    filteredData.sort((a, b) => getNumericPrice(b.price) - getNumericPrice(a.price));
                    break;
                case 'price-asc':
                    filteredData.sort((a, b) => getNumericPrice(a.price) - getNumericPrice(b.price));
                    break;
                case 'date-desc':
                    filteredData.sort((a, b) => new Date(b.created) - new Date(a.created));
                    break;
                case 'date-asc':
                    filteredData.sort((a, b) => new Date(a.created) - new Date(b.created));
                    break;
                case 'az':
                    filteredData.sort((a, b) => {
                        const textA = a.username.toLowerCase();
                        const textB = b.username.toLowerCase();
                        return textA.localeCompare(textB);
                    });
                    break;
                default:
                    filteredData = shuffleArray([...filteredData]);
            }

            const list = document.getElementById('fileContent');
            list.innerHTML = '';

            filteredData.forEach(item => {
                let li = document.createElement('li');
                li.className = 'list-group-item';

                // Image with Twitter Blue ring
                let imgContainer = document.createElement('div');
                imgContainer.className = 'avatar-wrapper';
                let img = document.createElement('img');
                img.src = 'https://i.psnprofiles.com/avatars/m/G9279856b8.png';
                img.alt = 'Image for ' + item.username;
                imgContainer.appendChild(img);
                li.appendChild(imgContainer);

                let infoContainer = document.createElement('div');
                infoContainer.className = 'item-info';

                // Username
                let userInfo = document.createElement('div');
                userInfo.className = 'user-info';
                let atSymbol = document.createElement('span');
                atSymbol.className = 'at-symbol';
                atSymbol.textContent = '@';
                let textSpan = document.createElement('span');
                textSpan.className = 'text-part';
                textSpan.textContent = item.username;
                userInfo.appendChild(atSymbol);
                userInfo.appendChild(textSpan);
                infoContainer.appendChild(userInfo);

                // Details (Followers, Posts, etc.) - Restored for Twitter
                let detailsContainer = document.createElement('div');
                detailsContainer.className = 'account-details';
                let detailHTML = `
                    <div class="detail-item">📅 作成日: ${item.created}</div>
                    <div class="detail-item">👥 フォロー: ${item.follow}人</div>
                    <div class="detail-item">❤️ フォロワー: ${item.followers}人</div>
                    <div class="detail-item">📝 投稿数: ${item.posts}件</div>
                `;
                detailsContainer.innerHTML = detailHTML;
                infoContainer.appendChild(detailsContainer);

                let priceTag = document.createElement('div');
                priceTag.className = 'price-tag';
                priceTag.textContent = `¥${item.price}`; 
                infoContainer.appendChild(priceTag);

                let purchaseButton = document.createElement('button');
                purchaseButton.className = 'item-button';
                purchaseButton.textContent = '購入する';
                purchaseButton.onclick = function () {
                    openModal('purchaseModal');
                };
                infoContainer.appendChild(purchaseButton);

                li.appendChild(infoContainer);
                list.appendChild(li);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadAndDisplayFile();
            document.getElementById('searchInput').addEventListener('input', function (e) {
                const input = e.target;
                if (!input.value.match(/^[a-zA-Z0-9_]*$/)) {
                    input.value = input.value.replace(/[^a-zA-Z0-9_]/g, '');
                }
                updateList();
            });
            document.getElementById('sortSelect').addEventListener('change', updateList);

            // Header hide on scroll
            const header = document.querySelector('.fixed-header');
            let lastScrollTop = 0;
            let scrollCounter = 0;
            let lastScrollTime = Date.now();

            window.addEventListener('scroll', function () {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                let currentTime = Date.now();
                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    scrollCounter++;
                    if (scrollCounter >= 10 || currentTime - lastScrollTime > 300) {
                        header.style.top = '-150px';
                    }
                } else {
                    scrollCounter = 0;
                    header.style.top = '0';
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
                lastScrollTime = currentTime;
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const purchaseSection = document.querySelector('.purchase-links-section');
            if (purchaseSection) {
                purchaseSection.addEventListener('contextmenu', event => event.preventDefault());
                purchaseSection.addEventListener('selectstart', event => event.preventDefault());
            }
        });
    </script>
</body>
</html>
